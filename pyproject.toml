[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "make-it-all"
version = "1.0"
description = "A productivity and knowledge management system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
make-it-all = "make_it_all.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["make_it_all*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
